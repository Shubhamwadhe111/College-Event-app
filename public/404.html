<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nexus - Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .message {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .fallback {
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }
    .fallback a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Nexus</div>
    <div class="message">Redirecting to the correct page...</div>
    <div class="spinner"></div>
    <div class="fallback">
      If you're not redirected automatically, 
      <a href="/College-Event-app/">click here to go to the homepage</a>
    </div>
  </div>

  <script type="text/javascript">
    (function() {
      // GitHub Pages SPA redirect using sessionStorage approach
      var l = window.location;
      var basePath = '/College-Event-app';
      
      // Get the path that caused the 404
      var path = l.pathname;
      
      // Remove the base path to get the actual route
      if (path.startsWith(basePath)) {
        path = path.substring(basePath.length);
      }
      
      // Store the intended path in sessionStorage
      if (path && path !== '/' && path !== '') {
        sessionStorage.setItem('nexus_redirect_path', path + l.search + l.hash);
      }
      
      // Always redirect to the main index.html
      l.replace(basePath + '/');
    })();
  </script>
</body>
</html>
