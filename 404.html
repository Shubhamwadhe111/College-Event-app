<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nexus - Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      text-align: center;
      padding: 2rem;
    }
    .logo {
      font-size: 2.5rem;
      font-weight: bold;
      margin-bottom: 1rem;
    }
    .message {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.3);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .fallback {
      margin-top: 2rem;
      font-size: 0.9rem;
      opacity: 0.7;
    }
    .fallback a {
      color: white;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Nexus</div>
    <div class="message">Redirecting to the correct page...</div>
    <div class="spinner"></div>
    <div class="fallback">
      If you're not redirected automatically, 
      <a href="/College-Event-app/">click here to go to the homepage</a>
    </div>
  </div>

  <script type="text/javascript">
    (function() {
      // Prevent redirect loops by checking redirect count
      var redirectCount = parseInt(sessionStorage.getItem('nexus_redirect_count') || '0');
      
      if (redirectCount >= 3) {
        console.error('Too many redirects, stopping to prevent infinite loop');
        document.querySelector('.message').textContent = 'Unable to redirect. Please use the link below.';
        document.querySelector('.spinner').style.display = 'none';
        return;
      }
      
      // Increment redirect count
      sessionStorage.setItem('nexus_redirect_count', (redirectCount + 1).toString());
      
      // Get the current path and search parameters
      var currentPath = window.location.pathname;
      var currentSearch = window.location.search;
      var currentHash = window.location.hash;
      
      // Remove the base path if it exists (for GitHub Pages)
      var basePath = '/College-Event-app';
      if (currentPath.startsWith(basePath)) {
        currentPath = currentPath.substring(basePath.length);
      }
      
      // Ensure path starts with /
      if (!currentPath.startsWith('/')) {
        currentPath = '/' + currentPath;
      }
      
      // Construct the full original URL
      var originalUrl = currentPath + currentSearch + currentHash;
      
      // Only redirect if we have a meaningful path (not just root)
      if (currentPath && currentPath !== '/' && currentPath !== '') {
        // Encode the original URL as a query parameter
        var redirectUrl = basePath + '/?p=' + encodeURIComponent(originalUrl);
        
        console.log('404 Redirect: ' + window.location.href + ' -> ' + redirectUrl);
        
        // Perform the redirect
        window.location.replace(redirectUrl);
      } else {
        // If it's just the root path, redirect to homepage
        window.location.replace(basePath + '/');
      }
    })();
  </script>
</body>
</html>
