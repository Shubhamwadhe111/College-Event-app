<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .loading {
      text-align: center;
    }
    .spinner {
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top: 3px solid white;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script>
    (function() {
      try {
        // Extract the current path, search, and hash
        const currentPath = window.location.pathname;
        const currentSearch = window.location.search;
        const currentHash = window.location.hash;
        
        // Combine full route
        const fullRoute = currentPath + currentSearch + currentHash;
        
        // Store the intended route in sessionStorage for recovery
        sessionStorage.setItem('nexus_redirect_path', fullRoute);
        sessionStorage.setItem('nexus_redirect_timestamp', Date.now().toString());
        
        // Determine the base URL for GitHub Pages
        const baseUrl = '/College-Event-app/';
        
        // Redirect to the main app
        window.location.replace(baseUrl);
        
      } catch (error) {
        // Fallback if JavaScript fails
        console.error('Route preservation failed:', error);
        window.location.replace('/College-Event-app/');
      }
    })();
  </script>
  <!-- Fallback meta refresh for browsers with JavaScript disabled -->
  <meta http-equiv="refresh" content="0; url=/College-Event-app/">
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <h2>Redirecting to Nexus...</h2>
    <p>If you are not redirected automatically, <a href="/College-Event-app/" style="color: white;">click here</a>.</p>
  </div>
</body>
</html>
